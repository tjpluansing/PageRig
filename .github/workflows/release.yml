name: Release

# Pushing a tag like v1.0.0 builds the desktop installers and the server's
# Docker image, and puts them on a draft GitHub release to check and publish.
# Pull requests that change this file run the builds without publishing.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [.github/workflows/release.yml]

permissions:
  contents: write
  packages: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: --bundles deb,appimage
          - os: windows-latest
            args: --bundles nsis,msi
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - run: npm ci
      - name: Build installers
        run: npx tauri build --verbose ${{ matrix.args }}
        env:
          # linuxdeploy's bundled strip is too old for some system libraries,
          # and it runs without FUSE when it unpacks itself instead.
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to GitHub's container registry
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: names
        run: |
          image="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/pagerig"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tags=$image:${GITHUB_REF_NAME#v},$image:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$image:test" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          load: ${{ !startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.names.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check the image starts and serves the app
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          image=$(echo '${{ steps.names.outputs.tags }}' | cut -d, -f1)
          docker run -d --name pagerig -p 8080:8080 -e SIGN_API_KEY=test "$image"
          for i in $(seq 30); do curl -fs localhost:8080/health && break; sleep 1; done
          curl -fs localhost:8080/ | grep -q '<div id="root">'
          curl -fs localhost:8080/api/config
          docker logs pagerig

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [desktop, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/pagerig:${GITHUB_REF_NAME#v}"
          cat > notes.md <<EOF
          ## Download

          - **Windows:** the \`.exe\` installer (or \`.msi\`).
          - **macOS:** the \`.dmg\` (Apple silicon and Intel).
          - **Linux:** the \`.AppImage\`, or the \`.deb\` for Debian and Ubuntu.

          The installers aren't code-signed yet, so Windows SmartScreen and macOS Gatekeeper ask for confirmation the first time.
          On macOS, right-click the app and choose Open.

          ## Server

          The PageRig server (web app, signature requests, Office conversion and web page capture) is at \`$image\`.
          See the README for its settings.
          EOF
          gh release create "$GITHUB_REF_NAME" --draft --title "PageRig ${GITHUB_REF_NAME#v}" --notes-file notes.md --generate-notes installers/*
