name: Release

# Pushing a tag like v1.0.0 builds the desktop installers and the server's
# Docker image, and puts them on a draft GitHub release to check and publish.
# Pull requests that change this file run the builds without publishing.
#
# Installers are signed for automatic updates with the key in the
# TAURI_SIGNING_PRIVATE_KEY secret (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD);
# TAURI_UPDATER_PUBKEY is its public half, built into the app to check updates.
# The release carries latest.json, which installed copies read once it's published.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [.github/workflows/release.yml]

permissions:
  contents: write
  packages: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: --bundles deb,appimage
          - os: windows-latest
            args: --bundles nsis,msi
          - os: macos-latest
            # The app bundle is what macOS updates install.
            args: --target universal-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - run: npm ci
      - name: Set up update signing
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          if [[ -z "$KEY" || -z "$PUBKEY" ]]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY and TAURI_UPDATER_PUBKEY secrets so installed copies can update."
              exit 1
            fi
            # Pull requests sign with a throwaway key to check the update files get made.
            npx tauri signer generate --ci -w "$RUNNER_TEMP/updater.key" -p ""
            KEY=$(cat "$RUNNER_TEMP/updater.key")
            PASSWORD=""
            PUBKEY=$(cat "$RUNNER_TEMP/updater.key.pub")
          fi
          echo "::add-mask::$KEY"
          {
            echo "TAURI_SIGNING_PRIVATE_KEY<<KEY_END"
            echo "$KEY"
            echo "KEY_END"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$PASSWORD"
          } >> "$GITHUB_ENV"
          # The public key is the one-line text in updater.key.pub. Accept it with stray
          # quotes or spaces, or as the decoded two-line text, and write the JSON with
          # node so nothing in it can break the file.
          KEY="$KEY" PUBKEY="$PUBKEY" node -e '
            if (!/^[A-Za-z0-9+\/=\s]+$/.test(process.env.KEY) || !Buffer.from(process.env.KEY, "base64").toString().includes("secret key")) {
              console.log("::error::TAURI_SIGNING_PRIVATE_KEY is not a Tauri private key. Paste the whole contents of the .key file (not .key.pub), with nothing around it.");
              process.exit(1);
            }
            let key = process.env.PUBKEY.trim().replace(/^["'\'']+|["'\'']+$/g, "").trim();
            if (key.includes("minisign public key")) key = Buffer.from(key.replace(/\r/g, "") + (key.endsWith("\n") ? "" : "\n")).toString("base64");
            if (!Buffer.from(key, "base64").toString().includes("minisign public key")) {
              console.log("::error::TAURI_UPDATER_PUBKEY is not a Tauri public key. Paste the whole contents of the .key.pub file made with the private key, with nothing around it.");
              process.exit(1);
            }
            const conf = { bundle: { createUpdaterArtifacts: true }, plugins: { updater: { pubkey: key } } };
            require("fs").writeFileSync(process.argv[1], JSON.stringify(conf));
          ' "$RUNNER_TEMP/updater.conf.json"
      - name: Build installers
        shell: bash
        run: npx tauri build --verbose --config "$RUNNER_TEMP/updater.conf.json" ${{ matrix.args }}
        env:
          # linuxdeploy's bundled strip is too old for some system libraries,
          # and it runs without FUSE when it unpacks itself instead.
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage*
            src-tauri/target/release/bundle/nsis/*.exe*
            src-tauri/target/release/bundle/msi/*.msi*
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz*
          if-no-files-found: error

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to GitHub's container registry
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: names
        run: |
          image="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/pagerig"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tags=$image:${GITHUB_REF_NAME#v},$image:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$image:test" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          load: ${{ !startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.names.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check the image starts and serves the app
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          image=$(echo '${{ steps.names.outputs.tags }}' | cut -d, -f1)
          docker run -d --name pagerig -p 8080:8080 -e SIGN_API_KEY=test "$image"
          for i in $(seq 30); do curl -fs localhost:8080/health && break; sleep 1; done
          curl -fs localhost:8080/ | grep -q '<div id="root">'
          curl -fs localhost:8080/api/config
          docker logs pagerig

  release:
    needs: [desktop, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: installers
          # Only the installers; the Docker build also leaves a build-record artifact.
          pattern: installers-*
          merge-multiple: true
      - name: Write the update manifest
        run: node .github/update-manifest.mjs installers "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.0.0-test' }}" "$GITHUB_REPOSITORY"
      - name: Create a draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/pagerig:${GITHUB_REF_NAME#v}"
          cat > notes.md <<EOF
          ## Download

          - **Windows:** the \`.exe\` installer (or \`.msi\`).
          - **macOS:** the \`.dmg\` (Apple silicon and Intel).
          - **Linux:** the \`.AppImage\`, or the \`.deb\` for Debian and Ubuntu.

          The installers aren't code-signed yet, so Windows SmartScreen and macOS Gatekeeper ask for confirmation the first time.
          On macOS, right-click the app and choose Open.

          Once this release is published, copies of PageRig that already have automatic updates offer to install it.

          ## Server

          The PageRig server (web app, signature requests, Office conversion and web page capture) is at \`$image\`.
          See the README for its settings.
          EOF
          # Replace a draft left by an earlier failed run of this tag.
          gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.draft and .tag_name == \"$GITHUB_REF_NAME\") | .id" |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done
          # The artifacts keep their build folders, so upload every file inside them.
          find installers -type f -print0 | xargs -0 gh release create "$GITHUB_REF_NAME" --draft --title "PageRig ${GITHUB_REF_NAME#v}" --notes-file notes.md --generate-notes
