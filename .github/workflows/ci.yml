name: CI

on:
  push:
    branches: [Primary]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Server tests
        working-directory: server
        shell: bash
        # Failing tests are also listed as annotations, so they show on the PR.
        run: |
          npm ci
          set +e
          npm test 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          [ $status -ne 0 ] && grep -E "not ok|error:|Error|actual|expected" test.log | head -30 | sed 's/^ */::error::/'
          exit $status
      - run: npm run build

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - run: npm ci
      - name: Build desktop app
        run: npx tauri build --bundles ${{ runner.os == 'Linux' && 'deb' || runner.os == 'Windows' && 'nsis' || 'app' }}
      - uses: actions/upload-artifact@v4
        with:
          name: pagerig-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: warn
