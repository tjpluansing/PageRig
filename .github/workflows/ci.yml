name: CI

on:
  push:
    branches: [Primary]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Which Chrome (diagnostic)
        shell: bash
        run: |
          for b in /usr/bin/chromium /usr/bin/chromium-browser /usr/bin/google-chrome /usr/bin/google-chrome-stable; do
            [ -e "$b" ] && echo "$b -> $(readlink -f $b): $($b --version 2>&1 | head -1)"
          done
          d=$(mktemp -d)
          b=$(ls /usr/bin/chromium /usr/bin/chromium-browser /usr/bin/google-chrome 2>/dev/null | head -1)
          timeout 60 $b --headless --no-sandbox --disable-gpu --user-data-dir=$d/p --print-to-pdf=$d/t.pdf "data:text/html,<h1>hi</h1>" 2>&1 | tail -5
          echo "exit $?"; ls -la $d
      - name: Server tests
        working-directory: server
        shell: bash
        # Failing tests are also listed as annotations, so they show on the PR.
        run: |
          npm ci
          set +e
          npm test 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          [ $status -ne 0 ] && grep -iE "not ok|error|actual|expected|chromium" test.log | head -40 | sed 's/^ */::error::/'
          exit $status
      - run: npm run build

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - run: npm ci
      - name: Build desktop app
        run: npx tauri build --bundles ${{ runner.os == 'Linux' && 'deb' || runner.os == 'Windows' && 'nsis' || 'app' }}
      - uses: actions/upload-artifact@v4
        with:
          name: pagerig-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: warn
